
name: Maharashtrachi Olakh CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maharashtrachi-olakh-production
  cancel-in-progress: false

jobs:
  build:
    name: Install, validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Validate backend source
        run: |
          set -eu

          test -s backend/index.js
          test -s backend/package.json
          test -s backend/package-lock.json

          node --check backend/index.js
          node -e "JSON.parse(require('fs').readFileSync('backend/package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('backend/package-lock.json', 'utf8'))"

          echo "Backend entry point and dependency files are valid."

      - name: Build public website
        run: npm run build:ashoka

      - name: Build admin panel
        run: npm run build:admin

      - name: Verify build outputs
        run: |
          set -eu

          test -s Frontend/dist/index.html
          test -s admin-panel/dist/index.html

          echo "Public website:"
          du -sh Frontend/dist
          find Frontend/dist -type f | wc -l

          echo "Admin panel:"
          du -sh admin-panel/dist
          find admin-panel/dist -type f | wc -l

          echo "Commit: $GITHUB_SHA"

      - name: Upload public website artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-website-dist
          path: Frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload admin panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-dist
          path: admin-panel/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend source artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: |
            backend/**
            !backend/node_modules/**
            !backend/.env
            !backend/.git/**
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy website, admin and backend to VPS
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Download public website
        uses: actions/download-artifact@v4
        with:
          name: public-website-dist
          path: release/public

      - name: Download admin panel
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-dist
          path: release/admin

      - name: Download backend source
        uses: actions/download-artifact@v4
        with:
          name: backend-release
          path: release/backend

      - name: Validate downloaded releases
        run: |
          set -eu

          test -s release/public/index.html
          test -s release/admin/index.html
          test -s release/backend/index.js
          test -s release/backend/package.json
          test -s release/backend/package-lock.json

          node --check release/backend/index.js

          echo "All three releases passed validation."

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test VPS SSH and prepare staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             echo "SSH connection successful."
             id -un
             command -v rsync
             mkdir -p "$HOME/staging/public"
             mkdir -p "$HOME/staging/admin"
             mkdir -p "$HOME/staging/backend"'

      - name: Transfer public website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          rsync \
            -az --delete --partial \
            --human-readable --stats \
            --timeout=180 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            release/public/ \
            "$VPS_USER@$VPS_HOST:staging/public/"

      - name: Transfer admin panel
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          rsync \
            -az --delete --partial \
            --human-readable --stats \
            --timeout=180 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            release/admin/ \
            "$VPS_USER@$VPS_HOST:staging/admin/"

      - name: Transfer backend source
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          rsync \
            -az --delete --partial \
            --human-readable --stats \
            --timeout=180 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20" \
            release/backend/ \
            "$VPS_USER@$VPS_HOST:staging/backend/"

      - name: Validate remote staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             for dir in public admin backend; do
               test -d "$HOME/staging/$dir"
             done

             test -s "$HOME/staging/public/index.html"
             test -s "$HOME/staging/admin/index.html"
             test -s "$HOME/staging/backend/index.js"
             test -s "$HOME/staging/backend/package.json"
             test -s "$HOME/staging/backend/package-lock.json"

             node --check "$HOME/staging/backend/index.js"

             echo "Remote staging validation passed."'

      - name: Publish website, admin and backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             sudo -n /usr/local/sbin/deploy-maharashtrachiolakh-frontend
             sudo -n /usr/local/sbin/deploy-maharashtrachiolakh-backend "$HOME/staging/backend"'

      - name: Verify live public website
        run: |
          set -eu

          curl \
            --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            --max-time 30 --output /dev/null \
            "https://maharashtrachiolakh.com/?deploy=${GITHUB_SHA}"

          echo "Public website check passed."

      - name: Verify live admin panel
        run: |
          set -eu

          curl \
            --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            --max-time 30 --output /dev/null \
            "https://maharashtrachiolakh.com/admin/?deploy=${GITHUB_SHA}"

          echo "Admin panel check passed."

      - name: Verify live backend API
        run: |
          set -eu

          curl \
            --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            --max-time 30 \
            "https://maharashtrachiolakh.com/api/health"

          echo
          echo "Backend API health check passed."
