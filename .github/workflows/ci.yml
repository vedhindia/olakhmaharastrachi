
name: Maharashtrachi Olakh CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maharashtrachi-olakh-production
  cancel-in-progress: false

jobs:
  build:
    name: Install, check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check backend/index.js

      - name: Build public website
        run: npm run build:ashoka

      - name: Build admin panel
        run: npm run build:admin

      - name: Verify build outputs
        run: |
          set -eu

          test -s Frontend/dist/index.html
          test -s admin-panel/dist/index.html

          echo "Public website build:"
          du -sh Frontend/dist
          find Frontend/dist -type f | wc -l

          echo "Admin panel build:"
          du -sh admin-panel/dist
          find admin-panel/dist -type f | wc -l

          echo "Commit being built: $GITHUB_SHA"

      - name: Upload public website artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-website-dist
          path: Frontend/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload admin panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-dist
          path: admin-panel/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy frontend to VPS
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Download public website artifact
        uses: actions/download-artifact@v4
        with:
          name: public-website-dist
          path: release/public

      - name: Download admin panel artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-dist
          path: release/admin

      - name: Verify downloaded artifacts
        run: |
          set -eu

          test -s release/public/index.html
          test -s release/admin/index.html

          echo "Downloaded public website:"
          du -sh release/public

          echo "Downloaded admin panel:"
          du -sh release/admin

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test VPS SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             printf "SSH connection successful\n"
             printf "Remote user: "
             id -un
             printf "Remote rsync: "
             command -v rsync
             mkdir -p "$HOME/staging/public" "$HOME/staging/admin"'

      - name: Transfer public website using rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "Starting public website transfer..."

          rsync \
            -az \
            --delete \
            --partial \
            --human-readable \
            --stats \
            --info=progress2 \
            --timeout=180 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6" \
            release/public/ \
            "$VPS_USER@$VPS_HOST:staging/public/"

          echo "Public website transfer completed."

      - name: Transfer admin panel using rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          echo "Starting admin panel transfer..."

          rsync \
            -az \
            --delete \
            --partial \
            --human-readable \
            --stats \
            --info=progress2 \
            --timeout=180 \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=6" \
            release/admin/ \
            "$VPS_USER@$VPS_HOST:staging/admin/"

          echo "Admin panel transfer completed."

      - name: Validate both remote staging builds
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" \
            'set -eu
             PUBLIC_DIR="$HOME/staging/public"
             ADMIN_DIR="$HOME/staging/admin"

             test -s "$PUBLIC_DIR/index.html"
             test -s "$ADMIN_DIR/index.html"

             echo "Public staging validation passed."
             du -sh "$PUBLIC_DIR"
             find "$PUBLIC_DIR" -type f | wc -l

             echo "Admin staging validation passed."
             du -sh "$ADMIN_DIR"
             find "$ADMIN_DIR" -type f | wc -l

             echo "Both staging builds are ready to publish."'

      - name: Publish frontend artifacts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "$VPS_USER@$VPS_HOST" \
            'sudo -n /usr/local/sbin/deploy-maharashtrachiolakh-frontend'

      - name: Verify live public website
        run: |
          set -eu

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            --max-time 30 \
            --output /dev/null \
            "https://maharashtrachiolakh.com/?deploy=${GITHUB_SHA}"

          echo "Public website returned a successful HTTP response."

      - name: Verify live admin panel
        run: |
          set -eu

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            --max-time 30 \
            --output /dev/null \
            "https://maharashtrachiolakh.com/admin/?deploy=${GITHUB_SHA}"

          echo "Admin panel returned a successful HTTP response."

      - name: Verify live API health
        run: |
          set -eu

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            --max-time 30 \
            https://maharashtrachiolakh.com/api/health

          echo
          echo "API health check passed."
